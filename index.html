<meta charset="utf-8">

<style>
/* 昼の球場。スコアボードの深緑に、魔球の桃色 */
:root{
  --board:#0f2e24;
  --board2:#18412f;
  --cream:#f6f0dc;
  --magic:#ff3fa4;
  --gold:#ffd23f;
  --ink:#0b1f18;
  --red:#e2402c;
  --disp:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:#9fc4dd;color:var(--cream);overflow:hidden;font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body,button,input,#app{touch-action:manipulation}
[hidden]{display:none!important}
#app{position:fixed;inset:0}
#c{width:100%;height:100%;display:block;touch-action:none}
#draw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
button{font-family:var(--body)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* 上の帯 */
#top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;align-items:flex-start;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
.chip{background:rgba(15,46,36,.88);color:var(--cream);border-radius:10px;padding:6px 11px;font-weight:900;font-size:13px;border:0;line-height:1.25}
button.chip{cursor:pointer}
#batInfo{margin-left:auto;text-align:right;max-width:62%}
#batInfo .nm{display:block;font-family:var(--disp);font-weight:400;font-size:15px;color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#batInfo .cnt{display:flex;gap:6px;justify-content:flex-end;align-items:center;margin-top:3px;font-size:12px}
.dots{display:inline-flex;gap:4px}
.dots i{width:13px;height:13px;border-radius:50%;background:rgba(246,240,220,.25);display:block}
.dots i.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
#inkBox{margin-left:auto;min-width:150px}
#inkBox span{display:block;font-size:11px;opacity:.85}
#ink{height:10px;border-radius:5px;background:rgba(246,240,220,.2);overflow:hidden;margin-top:4px}
#inkFill{height:100%;width:100%;background:linear-gradient(90deg,var(--magic),var(--gold));transition:width .08s}
#ink.low #inkFill{background:linear-gradient(90deg,var(--red),#ff9a3c)}
#ink.out #inkFill{background:var(--red)}

/* 中央の大きい文字 */
#msg{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;padding:0 16px}
#msgBig{font-family:var(--disp);font-size:clamp(38px,12vw,64px);line-height:1.05;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink),0 0 24px rgba(0,0,0,.35)}
#msgBig.good{color:var(--gold)}
#msgBig.magic{color:var(--magic)}
#msgSub{margin-top:10px;font-weight:900;font-size:15px;color:#fff;text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.7)}
#hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);text-align:center;font-weight:900;font-size:14px;color:#fff;text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.7);pointer-events:none;padding:0 16px;text-wrap:balance}
#hint.err{color:#ffd0d0}
#hint.top{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 66px)}

/* 下のボタン帯 */
.bar{position:absolute;left:0;right:0;bottom:0;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:8px;justify-content:center}
.bar button{flex:1;max-width:160px;font-weight:900;font-size:15px;border:0;border-radius:12px;padding:13px 6px;cursor:pointer;background:rgba(15,46,36,.92);color:var(--cream);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.bar button.go{background:var(--magic);color:#fff;box-shadow:0 3px 0 #8f1457}
.bar button:disabled{opacity:.45;cursor:default}

/* カード */
.overlay{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);place-items:safe center;background:rgba(6,20,15,.45);padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);overflow-y:auto}
.card{position:relative;width:min(100%,380px);background:var(--board);border-radius:14px;padding:24px 20px 18px;text-align:center;box-shadow:0 0 0 4px var(--board2),0 0 0 6px var(--cream),0 20px 44px rgba(0,0,0,.45)}
.card h1{font-family:var(--disp);font-weight:400;font-size:clamp(40px,13vw,54px);line-height:1;margin:6px 0 0;color:var(--cream);letter-spacing:.02em}
.card h1 .tama{color:var(--magic);text-shadow:0 0 18px rgba(255,63,164,.6)}
.ruby{font-weight:900;font-size:12px;letter-spacing:.3em;color:var(--gold);margin:0}
.sub{font-weight:900;font-size:15px;margin:12px 0 0}
.card h2{font-family:var(--disp);font-weight:400;font-size:24px;margin:0;color:var(--gold);line-height:1.25}
.big{display:block;width:100%;margin-top:12px;font-family:var(--disp);font-size:clamp(17px,5.4vw,21px);background:var(--magic);color:#fff;border:0;border-radius:12px;padding:12px 14px 13px;cursor:pointer;box-shadow:0 4px 0 #8f1457;letter-spacing:.03em;white-space:nowrap}
.big small{display:block;font-family:var(--body);font-weight:900;font-size:12px;opacity:.9;margin-top:2px;letter-spacing:0}
.big.gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #a07d0e}
.big.alt{background:transparent;color:var(--cream);border:2px solid rgba(246,240,220,.6);box-shadow:none;font-size:16px;padding:9px}
.big.x{background:#000;color:#fff;box-shadow:0 4px 0 #444;font-size:17px}
.big:disabled{opacity:.5;cursor:default}
.row2{display:flex;gap:8px}.row2 .big{flex:1}
.langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.langs button{font:700 13px var(--body);background:transparent;color:var(--cream);border:1.5px solid rgba(246,240,220,.45);border-radius:999px;padding:4px 11px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--cream);color:var(--board);border-color:var(--cream)}
.field{display:flex;gap:8px;margin-top:14px}
.field input{flex:1;min-width:0;font:700 17px var(--body);padding:11px 12px;border-radius:10px;border:2px solid var(--cream);background:#fffaf0;color:var(--ink);-webkit-user-select:text;user-select:text}
.field input.code{font-family:var(--disp);font-weight:400;letter-spacing:.18em;text-transform:uppercase;text-align:center;font-size:22px}
.note{margin:10px 0 0;font-weight:700;font-size:13px;opacity:.9;min-height:1.2em}
.note.err{color:#ffb3b3;opacity:1}
.codebox{margin:14px 0 0;background:var(--cream);color:var(--ink);border-radius:12px;padding:10px 8px 12px}
.codebox span{display:block;font-weight:900;font-size:12px;opacity:.7}
.codebox b{display:block;font-family:var(--disp);font-weight:400;font-size:clamp(30px,10vw,40px);letter-spacing:.14em;line-height:1.2}
.chal{margin:0 0 4px;font-weight:900;font-size:13px;color:var(--gold)}
.bname{font-family:var(--disp);font-size:clamp(24px,8vw,32px);color:#fff;margin:4px 0 0;line-height:1.2;word-break:break-all}
.stats{display:flex;justify-content:center;gap:8px;margin-top:12px}
.stats div{background:var(--board2);border-radius:10px;padding:6px 10px;min-width:82px}
.stats span{display:block;font-size:11px;font-weight:700;opacity:.8}
.stats b{display:block;font-family:var(--disp);font-weight:400;font-size:20px;color:var(--gold)}
.how{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px;text-align:left;font-weight:700;font-size:13.5px}
.how li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.how li b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--magic);color:#fff;font-size:11px}
.res-big{font-family:var(--disp);font-size:clamp(40px,13vw,56px);line-height:1.05;margin:0}
.res-big.win{color:var(--gold)}
.res-big.lose{color:#c9d6d0}
.tabs{display:flex;gap:4px;justify-content:center;margin-top:12px}
.tabs button{font:900 14px var(--body);border:2px solid var(--cream);background:transparent;color:var(--cream);border-radius:999px;padding:6px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--cream);color:var(--board)}
.rlist{list-style:none;margin:12px 0 0;padding:0;max-height:min(54vh,440px);overflow-y:auto;text-align:left;border-top:2px solid rgba(246,240,220,.5)}
.rlist li{display:grid;grid-template-columns:28px minmax(0,1fr) auto 34px;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid rgba(246,240,220,.2)}
.rlist li.mine{grid-template-columns:minmax(0,1fr) auto 34px 34px}
.rlist .no{font-family:var(--disp);font-size:16px;text-align:center;color:var(--gold)}
.rlist .nm{font-weight:900;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist .nm small{display:block;font-weight:700;font-size:11px;opacity:.7;letter-spacing:.06em}
.rlist .sc{text-align:right;font-size:11px;font-weight:700;line-height:1.25;white-space:nowrap}
.rlist .sc b{font-family:var(--disp);font-weight:400;font-size:17px;color:var(--gold)}
.rlist .pl,.rlist .dl{width:32px;height:32px;border-radius:50%;border:0;background:var(--magic);color:#fff;font-size:12px;cursor:pointer}
.rlist .dl{background:transparent;border:1.5px solid rgba(246,240,220,.5);color:var(--cream);font-size:14px}
.rempty{padding:18px 0;font-weight:700;text-align:center;display:block!important}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;color:var(--board);background:#9fc4dd}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .4s}
#tut{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);width:min(92%,420px);background:var(--magic);color:#fff;font-weight:900;font-size:15px;line-height:1.45;padding:10px 14px;border-radius:12px;box-shadow:0 4px 0 #8f1457,0 10px 24px rgba(0,0,0,.3);pointer-events:none;text-align:center;text-wrap:balance}
#pad{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;align-items:center;gap:8px;background:rgba(15,46,36,.9);color:var(--cream);font-weight:900;font-size:15px;padding:10px 16px;border-radius:999px;border:2px solid var(--gold);pointer-events:none;white-space:nowrap;max-width:94%}
#pad.hold{background:var(--gold);color:var(--ink);border-color:#fff;transform:translateX(-50%) scale(1.06)}
#pad .hand{font-size:22px;display:inline-block;animation:hand 1.1s ease-in-out infinite}
#pad.hold .hand{animation:none}
@keyframes hand{0%,100%{transform:translate(0,0)}25%{transform:translate(-8px,-4px)}75%{transform:translate(8px,-4px)}}
@media (prefers-reduced-motion:reduce){#pad .hand{animation:none}}
@media (max-width:360px){.card{padding:20px 14px 14px}}
@media (prefers-reduced-motion:reduce){#flash{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <canvas id="draw"></canvas>
  <div id="flash"></div>

  <div id="top" hidden>
    <button class="chip" id="backBtn" data-i="back">もどる</button>
    <button class="chip" id="helpBtn" data-i="help" hidden>遊び方</button>
    <div class="chip" id="inkBox" hidden><span data-i="ink">線ののこり</span><div id="ink"><div id="inkFill"></div></div></div>
    <div class="chip" id="batInfo" hidden><span class="nm" id="biName"></span><span class="cnt"><span>S</span><span class="dots" id="biS"><i></i><i></i><i></i></span><span id="biN"></span></span></div>
  </div>
  <div id="msg" hidden><div id="msgBig"></div><div id="msgSub"></div></div>
  <div id="hint" hidden></div>
  <div id="tut" hidden></div>
  <div id="pad" hidden><span class="hand" id="padHand">👆</span><span id="padT"></span></div>

  <div class="bar" id="edBar" hidden>
    <button id="edClear" data-i="edClear">消す</button>
    <button id="edTest" data-i="edTest">試し投げ</button>
    <button id="edReg" class="go" data-i="edReg">登録する</button>
  </div>

  <!-- タイトル -->
  <div class="overlay" id="title">
    <div class="card">
      <p class="ruby" data-i="ruby">まほうのたま</p>
      <h1 data-ih="titleH">魔法の<span class="tama">球</span></h1>
      <p class="sub" data-i="sub">線を描けば、それが魔球になる。</p>
      <div id="chalBox" hidden>
        <div class="codebox" style="background:var(--magic);color:#fff"><span data-i="chal">挑戦状がとどいています</span><b id="chalName" style="letter-spacing:0;font-size:clamp(22px,7vw,30px)"></b></div>
        <button class="big gold" id="chalGo" data-i="enter">打席に入る</button>
      </div>
      <button class="big" id="goMake"><span data-i="make">魔球を作る</span><small data-i="makeSub">ピッチャー</small></button>
      <button class="big gold" id="goCode"><span data-i="byCode">合言葉で打つ</span><small data-i="byCodeSub">バッター</small></button>
      <button class="big alt" id="goRandom" data-i="random">だれかの魔球を打つ</button>
      <button class="big alt" id="goRank" data-i="rank">ランキング</button>
      <p class="note" id="titleNote"></p>
      <div class="langs" role="group" aria-label="Language"><button data-lang="ja">日本語</button><button data-lang="en">English</button><button data-lang="zh">繁中</button><button data-lang="ko">한국어</button></div>
    </div>
  </div>

  <!-- 合言葉 -->
  <div class="overlay" id="codeP" hidden>
    <div class="card">
      <h2 data-i="codeTitle">合言葉で打つ</h2>
      <div class="field"><input id="codeIn" class="code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="ABCD2345"></div>
      <p class="note" id="codeNote"></p>
      <button class="big gold" id="codeGo" data-i="enter">打席に入る</button>
      <button class="big alt" id="codeBack" data-i="back">もどる</button>
    </div>
  </div>

  <!-- 名前をつける -->
  <div class="overlay" id="regP" hidden>
    <div class="card">
      <h2 data-i="regTitle">魔球に名前をつける</h2>
      <div class="field"><input id="nameIn" maxlength="16" autocomplete="off" data-ip="namePh" placeholder="魔球の名前（16文字まで）"></div>
      <p class="note" id="regNote"></p>
      <button class="big" id="regGo" data-i="regSend">登録</button>
      <button class="big alt" id="regBack" data-i="back">もどる</button>
    </div>
  </div>

  <!-- できた -->
  <div class="overlay" id="doneP" hidden>
    <div class="card">
      <h2 data-i="doneTitle">魔球ができた</h2>
      <p class="bname" id="doneName"></p>
      <div class="codebox"><span data-i="codeLabel">合言葉</span><b id="doneCode"></b></div>
      <p class="note" data-i="doneNote">この合言葉かリンクで、だれでもこの魔球を打てます</p>
      <button class="big x" id="doneShare" data-i="share">Xに投稿</button>
      <button class="big alt" id="doneCopy" data-i="copy">リンクをコピー</button>
      <button class="big gold" id="doneBat"><span data-i="tryBat">自分で打ってみる</span><small data-i="tryBatSub">記録されません</small></button>
      <button class="big alt" id="doneTitle" data-i="toTitle">タイトルへ</button>
    </div>
  </div>

  <!-- 打席の前 -->
  <div class="overlay" id="preP" hidden>
    <div class="card">
      <p class="chal" data-i="preFrom">魔球</p>
      <p class="bname" id="preName"></p>
      <div class="codebox" style="margin-top:10px;padding:6px 8px 8px"><span data-i="codeLabel">合言葉</span><b id="preCode" style="font-size:26px"></b></div>
      <div class="stats" id="preStats"></div>
      <p class="note" id="preNote"></p>
      <ul class="how">
        <li><b>1</b><span data-i="how1">指を置いたまま動かすと、バットの芯（輪）が動く</span></li>
        <li><b>2</b><span data-i="how2">指をはなした瞬間にスイング</span></li>
        <li><b>3</b><span data-i="how3">3ストライクまでにヒットを打てば勝ち</span></li>
      </ul>
      <button class="big gold" id="preGo" data-i="enter">打席に入る</button>
      <button class="big alt" id="preBack" data-i="back">もどる</button>
    </div>
  </div>

  <!-- 打席のあと -->
  <div class="overlay" id="endP" hidden>
    <div class="card">
      <p class="res-big" id="endBig"></p>
      <p class="sub" id="endSub"></p>
      <div class="codebox" style="padding:6px 8px 8px"><span data-i="codeLabel">合言葉</span><b id="endCode" style="font-size:26px"></b></div>
      <div class="stats" id="endStats"></div>
      <p class="note" id="endNote"></p>
      <button class="big x" id="endShare" data-i="share">Xに投稿</button>
      <button class="big gold" id="endNext" data-i="next">ほかの魔球を打つ</button>
      <div class="row2"><button class="big alt" id="endAgain" data-i="again">もう一回</button><button class="big alt" id="endTitle" data-i="toTitle">タイトルへ</button></div>
    </div>
  </div>

  <!-- ランキング -->
  <div class="overlay" id="rankP" hidden>
    <div class="card">
      <h2 data-i="rankTitle">打たれていない魔球</h2>
      <div class="tabs" role="group"><button id="tabRank" aria-pressed="true" data-i="tabRank">ランキング</button><button id="tabMine" aria-pressed="false" data-i="tabMine">自分の魔球</button></div>
      <ol class="rlist" id="rlist"></ol>
      <button class="big alt" id="rankClose" data-i="close">とじる</button>
    </div>
  </div>

  <div id="loading">…</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $ = s => document.querySelector(s);
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) { } }
const QS = new URLSearchParams(location.search);
const GAME_URL = 'https://nasubi-no-oniwa.github.io/mahou-no-tama/';

/* ===================== ことば ===================== */
const TX = {
  ja: {
    title: '魔法の球', ruby: 'まほうのたま', titleH: '魔法の<span class="tama">球</span>', sub: '線を描けば、それが魔球になる。',
    make: '魔球を作る', makeSub: 'ピッチャー', byCode: '合言葉で打つ', byCodeSub: 'バッター', random: 'だれかの魔球を打つ', rank: 'ランキング',
    chal: '魔球の挑戦状がとどいています', enter: '打席に入る', back: 'もどる', toTitle: 'タイトルへ', close: 'とじる',
    ink: '線ののこり', edClear: '消す', edTest: '試し投げ', edReg: '登録する',
    edHint: 'ボールから線を引いて、ストライクゾーンで止める', edDrawn: '試し投げで確かめてから登録しよう',
    errStart: 'ピッチャーの手のボールから描きはじめてね', errZone: 'ストライクゾーンで止めないと受けつけられません', errInk: '線がもう伸ばせません。ここで止めてね', errShort: 'もう少し長く描いてね',

  const k = metersPerPx() * 1.15, dx = e.clientX - D.x, dy = e.clientY - D.y; D.x = e.clientX; D.y = e.clientY;
  // カメラはホームから投手を向いているので、画面の右 = -x
  BAT.cur.x = clamp(BAT.cur.x - dx * k, -.7, .7); BAT.cur.y = clamp(BAT.cur.y - dy * k, .25, 1.5); placeCursor();
  if (BAT.tut === 1) BAT.tutDrag += Math.hypot(dx, dy);
}
function batUp(e) {
  const D = BAT.drag; if (!D || D.id !== e.pointerId) return; BAT.drag = null;
  if (BAT.tut === 1) { if (BAT.tutDrag >= 60) startPractice(); return; }
  if (!PITCH || BAT.swung || PITCH.t < 0 || PITCH.judged) return; // かまえ中ははなしても振らない
  BAT.swung = true; BAT.swingT = PITCH.t; BAT.swingK = 0.0001; SND.miss();
}
function judge(S) {
  const end = S.P.W[S.P.W.length - 1], arrive = WINDUP + S.P.T;
  passMark.position.set(end.x, end.y, ZP + .01); passMark.lookAt(camera.position); passMark.visible = true;
  let res, sub = [];
  if (!BAT.swung) { res = 'looking'; sub.push(tr('noSwing')); }
  else {
    const dt = BAT.swingT + SWING - arrive; // マイナス = 早い
    const dx = BAT.cur.x - end.x, dy = BAT.cur.y - end.y, dist = Math.hypot(dx, dy), adt = Math.abs(dt);
    if (dist < .07 && adt < .045) res = 'hr';
    else if (dist < .15 && adt < .085) res = 'hit';
    else if (dist < .24 && adt < .14) res = 'foul';
    else res = 'swingMiss';
    sub.push(adt < .03 ? tr('tJust') : dt < 0 ? tr('tEarly') : tr('tLate'));
    if (dist < .04) sub.push(tr('pJust'));
    else if (Math.abs(dy) >= Math.abs(dx)) sub.push(dy > 0 ? tr('pHigh') : tr('pLow'));
    else sub.push(dx > 0 ? tr('pRight') : tr('pLeft')); // +x は画面の左
    if (res === 'hr' || res === 'hit' || res === 'foul') {
      // 打球
      const yaw = clamp(dt * 9, -.85, .85), pitchA = res === 'hr' ? .58 + Math.random() * .1 : res === 'hit' ? .15 + Math.random() * .12 : .9;
      const sp = res === 'hr' ? 47 : res === 'hit' ? 34 : 22;
      let dir = V3(-Math.sin(yaw), 0, Math.cos(yaw));
      if (res === 'foul') dir = V3((dt < 0 ? 1 : -1) * .9, 0, -.4).normalize();
      S.hitV = dir.multiplyScalar(Math.cos(pitchA) * sp); S.hitV.y = Math.sin(pitchA) * sp;
      ball.position.set(end.x, end.y, ZP + .02); ball.visible = true;
      if (res === 'foul') { SND.foul(); buzz(20); } else { SND.crack(); buzz(res === 'hr' ? [30, 40, 60] : 40); flash(); if (res === 'hr') SND.cheer(); }
    }
  }
  if (res === 'swingMiss' || res === 'looking') { SND.ooh(); }
  BAT.result = res;
  const cls = res === 'hr' || res === 'hit' ? 'good' : res === 'foul' ? '' : 'magic';
  bigMsg(tr(res), sub.join(' ／ '), cls, 1.6);
  hint('');
  if (BAT.tut === 2) return; // 練習の球は数えない
  // カウント
  if (res === 'hr' || res === 'hit') { BAT.over = 'win'; }
  else if (res === 'foul') { if (BAT.strikes < 2) BAT.strikes++; }
  else BAT.strikes++;
  if (BAT.strikes >= 3 || (BAT.n >= 12 && !BAT.over)) BAT.over = 'lose';
  batUI();
}
function afterPitch() {
  PITCH = null;
  if (BAT.over) { setTimeout(() => endAtBat(BAT.over === 'win'), 350); return; }
  setTimeout(() => { if (mode === 'bat') nextPitch(); }, 200);
}
function updateSwing(dt) {
  if (BAT.swingK > 0 && BAT.swingK < 1) {
    BAT.swingK = Math.min(1, BAT.swingK + dt / .16);
    batterPose(BAT.swingK); setBat(BAT.swingK, lerp(BATP.y, BAT.cur.y + .02, Math.min(1, BAT.swingK * 2)));
  }
}

async function openBall(code, direct) {
  code = cleanCode(code);
  if (code.length !== 8) return { err: tr('codeBad') };
  let b; try { b = await fbGet('mahou/balls/' + code); } catch (e) { return { err: tr('netFail') }; }
  const W = b && decode(b.p);
  if (!b || !W || typeof b.n !== 'string') return { err: tr('notFound') };
  BAT.ball = { n: b.n.slice(0, 16), u: b.u }; BAT.code = code; BAT.P = makePath(W);
  BAT.mine = b.u === myUid() || mine().some(x => x.c === code);
  BAT.practice = BAT.mine || doneList().includes(code); BAT.counted = BAT.practice;
  if (direct) { startAtBat(); return {}; }
  // 打席の前
  mode = 'pre'; resetScene(); setCam('bat'); hud(); hint('');
  $('#preName').textContent = BAT.ball.n; $('#preCode').textContent = code; $('#preStats').innerHTML = '';
  $('#preNote').textContent = BAT.mine ? tr('mineNote') : BAT.practice ? tr('doneNote2') : '';
  showPanel('#preP');
  fbGet('mahou/cnt/' + code).then(c => { $('#preStats').innerHTML = statsHtml(c); if (!c && !BAT.practice) $('#preNote').textContent = tr('preNone'); }).catch(() => { });
  // サーバー側で挑戦ずみか
  if (!BAT.practice && myUid()) fbGet('mahou/res/' + code + '/' + myUid()).then(r => { if (r) { BAT.practice = true; BAT.counted = true; markDone(code); $('#preNote').textContent = tr('doneNote2'); } }).catch(() => { });
  return {};
}

  } else { ballScale = 1.6; ball.userData.halo.material.opacity = .18; }
  if (ball.visible) { ball.rotation.x += dt * 30; ball.userData.glow.material.opacity = .4 + Math.sin(tAll * 20) * .12; ball.scale.setScalar(ballScale); }
  ballShadow.visible = ball.visible && ball.position.y < 12; if (ballShadow.visible) { ballShadow.position.set(ball.position.x, .05, ball.position.z); ballShadow.scale.setScalar(ballScale * clamp(1.4 - ball.position.y * .25, .4, 1.4)); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
